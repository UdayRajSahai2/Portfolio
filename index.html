<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uday's Room</title>
    <meta name="description" content="A 3D room portfolio. Each object is an interest and opens the projects behind it." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <span class="loader-knight" aria-hidden="true">♞</span>
        <p class="loader-text" id="loader-text">Setting up the room</p>
        <div class="loader-bar" aria-hidden="true"><span id="loader-fill"></span></div>
        <button id="enter" class="enter" type="button" disabled>Enter the room</button>
        <p class="loader-note">Sound is on. You can mute it any time.</p>
      </div>
    </div>

    <header class="mark">
      <h1 id="name"></h1>
      <p id="tagline"></p>
    </header>

    <p id="hint" class="hint">Click the floor to walk, or click anything that catches your eye. Drag to look around.</p>

    <nav id="dock" class="dock" aria-label="Interests"></nav>

    <button id="sound" class="sound" type="button" aria-pressed="true">
      <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sound-label">Sound on</span>
    </button>

    <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" inert>
      <button id="panel-close" class="panel-close" type="button">Back to the room</button>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>
    <div id="bubble" class="bubble" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
