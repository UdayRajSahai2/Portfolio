<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Uday Raj Sahai</title>
    <meta name="description" content="Uday Raj Sahai, full stack developer. Walk into his room: code, books, films and anime, the gym, the stars and chess." />
    <meta name="theme-color" content="#f8f5ec" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23f2d64b'/><text x='32' y='45' font-family='sans-serif' font-weight='700' font-size='38' text-anchor='middle' fill='%2318202c'>U</text></svg>" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet" />
  </head>
  <body class="is-intro">
    <canvas id="scene" aria-hidden="true"></canvas>

    <section id="intro" class="intro" aria-labelledby="intro-title">
      <div class="intro-copy">
        <h1 id="intro-title" class="intro-title"></h1>
        <p id="intro-sentence" class="intro-sentence"></p>
        <div class="intro-actions">
          <button id="enter" class="btn btn--primary" type="button" disabled></button>
          <p id="intro-status" class="intro-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <header class="topbar">
      <p class="wordmark" id="wordmark"></p>
      <button id="sound" class="btn btn--quiet sound" type="button" aria-pressed="true">
        <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sound-label">Sound on</span>
      </button>
    </header>

    <div class="bottom">
      <p id="hint" class="hint"></p>
      <nav id="dock" class="dock" aria-label="Sections"></nav>
    </div>

    <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" inert>
      <div class="panel-head">
        <button id="panel-close" class="btn btn--quiet panel-close" type="button">Back to the room</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <section id="sky" class="sky" role="dialog" aria-modal="true" aria-labelledby="sky-title" hidden>
      <div class="sky-top">
        <h2 id="sky-title" class="sky-title"></h2>
        <p id="sky-status" class="sky-status" role="status" aria-live="polite"></p>
      </div>
      <div class="sky-bottom">
        <p id="sky-help" class="sky-help"></p>
        <div class="sky-controls">
          <div class="sky-pad" role="group" aria-label="Look around">
            <button type="button" class="btn btn--quiet sky-btn" data-sky="up" aria-label="Look up">Up</button>
            <button type="button" class="btn btn--quiet sky-btn" data-sky="left" aria-label="Look left">Left</button>
            <button type="button" class="btn btn--quiet sky-btn" data-sky="right" aria-label="Look right">Right</button>
            <button type="button" class="btn btn--quiet sky-btn" data-sky="down" aria-label="Look down">Down</button>
          </div>
          <div class="sky-zoom" role="group" aria-label="Zoom">
            <button type="button" class="btn btn--quiet sky-btn" data-sky="in" aria-label="Zoom in">+</button>
            <button type="button" class="btn btn--quiet sky-btn" data-sky="out" aria-label="Zoom out">&minus;</button>
          </div>
          <button id="sky-close" type="button" class="btn sky-close" data-sky="close"></button>
        </div>
      </div>
    </section>

    <div id="tip" class="tip" role="tooltip" aria-hidden="true"></div>
    <div id="bubble" class="bubble" role="status" aria-live="polite"></div>

    <noscript>
      <main class="noscript">
        <h1>Uday Raj Sahai</h1>
        <p>Full stack developer. Away from code I lift weights, read, watch films, TV series and anime, and keep coming back to philosophy, psychology and astronomy.</p>
        <p><a href="mailto:udayrajsahai@gmail.com">udayrajsahai@gmail.com</a></p>
        <p><a href="https://github.com/UdayRajSahai2">GitHub</a></p>
        <p><a href="https://www.linkedin.com/in/udayrajsahai/">LinkedIn</a></p>
      </main>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
